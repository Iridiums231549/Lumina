services:
  - type: web
    name: lumina-blog
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app import init_db; init_db()" && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: LUMINA_SECRET_KEY
        generateValue: true
      - key: LUMINA_DATABASE_PATH
        value: /var/data/lumina.db
    disk:
      name: lumina-data
      mountPath: /var/data
      sizeGB: 1
