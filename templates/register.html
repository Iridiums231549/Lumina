{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">Create Account</p>
        <h1>注册 Lumina</h1>
        <p>创建一个账号，开始课程博客创作与内容协作。</p>
        <form method="POST" class="stack-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>
                <span>用户名</span>
                <input type="text" name="username" class="form-control" required autofocus>
            </label>
            <label>
                <span>昵称</span>
                <input type="text" name="nickname" class="form-control" placeholder="用于前台展示">
            </label>
            <label>
                <span>邮箱</span>
                <input type="email" name="email" class="form-control" required>
            </label>
            <label>
                <span>密码</span>
                <input type="password" name="password" class="form-control" required>
            </label>
            <label>
                <span>确认密码</span>
                <input type="password" name="password2" class="form-control" required>
            </label>
            <button type="submit" class="btn btn-primary full">注册账号</button>
        </form>
        <p class="auth-switch">已经有账号？<a href="{{ url_for('login') }}">去登录</a></p>
    </div>
</section>
{% endblock %}
